<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>QA render</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeStage } from './viewer-core.js';
import { loadHero, applyHeroPose, webAttachPoint } from './hero-skinned.js';

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 900), H = +(params.get('h') || 900);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +(params.get('exposure') || 1.0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const stage = makeStage(renderer, { ground: params.get('ground') !== '0' });
const pmrem = new THREE.PMREMGenerator(renderer);
stage.scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
stage.scene.environmentIntensity = 0.55;


// views: list of "name:eyeX,eyeY,eyeZ:targetX,targetY,targetZ:fov"
const views = (params.get('views') || 'front:0,3.4,-9:0,2.8,0:32').split('|').map((v) => {
  const [name, eye, target, fov] = v.split(':');
  return { name, eye: eye.split(',').map(Number), target: target.split(',').map(Number), fov: +fov || 32 };
});

let poseFrames = null;
if (params.get('poses')) poseFrames = await (await fetch(params.get('poses'))).json();

if (params.get('grid') === '1') {
  const grid = new THREE.GridHelper(2000, 1000, 0x8a93a6, 0x566070);
  grid.position.y = 0.002;
  stage.scene.add(grid);
}
const hero = await loadHero(params.get('glb') || 'out/hero.glb');
stage.scene.add(hero.wrapper);
// web line (hand -> anchor)
const webMat = new THREE.MeshStandardMaterial({ color: 0xf4f6fa, roughness: 0.4, emissive: 0x30343a });
const webLine = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1, 8, 1), webMat);
webLine.visible = false;
stage.scene.add(webLine);
const anchorDot = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
anchorDot.visible = false;
stage.scene.add(anchorDot);
const WEB_ATT = { Right: new THREE.Vector3(-0.07, -0.14, -0.005), Left: new THREE.Vector3(0.07, -0.14, -0.005) };
function placeWeb(world, anchor, hand) {
  if (!anchor || !hand) { webLine.visible = false; anchorDot.visible = false; return; }
  const hm = world[hand + 'Hand'];
  const a = WEB_ATT[hand].clone().applyMatrix4(hm);
  const b = new THREE.Vector3(...anchor);
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const dir = b.clone().sub(a);
  const len = dir.length();
  webLine.position.copy(mid);
  webLine.scale.set(1, len, 1);
  webLine.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  webLine.visible = true;
  anchorDot.position.copy(b); anchorDot.visible = true;
}

// scene geometry from the bake (walls, ledges)
if (poseFrames && poseFrames.scene && poseFrames.scene.boxes) {
  const wm = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.85 });
  for (const b of poseFrames.scene.boxes) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(b.size[0], b.size[1], b.size[2]), wm);
    m.position.set(b.center[0], b.center[1], b.center[2]);
    m.receiveShadow = true; m.castShadow = true;
    stage.scene.add(m);
  }
}
window.renderView = (viewIndex, frameIndex) => {
  const v = views[viewIndex];
  let pose = null;
  if (poseFrames) pose = poseFrames.frames[frameIndex ?? 0];
  let world;
  applyHeroPose(hero, pose);
  if (pose && pose.anchor && pose.hand) {
    const a = webAttachPoint(hero, pose.hand);
    world = { [pose.hand + 'Hand']: new THREE.Matrix4().makeTranslation(a.x - WEB_ATT[pose.hand].x, a.y - WEB_ATT[pose.hand].y, a.z - WEB_ATT[pose.hand].z) };
  }
  placeWeb(world, pose && pose.anchor, pose && pose.hand);
  const cam = new THREE.PerspectiveCamera(v.fov, W / H, 0.05, 400);
  let target = new THREE.Vector3(...v.target);
  let eye = new THREE.Vector3(...v.eye);
  if (pose && pose.rootCF && params.get('follow') === '1') {
    const off = new THREE.Vector3(pose.rootCF[0], Math.max(0, pose.rootCF[1] - 3.3), pose.rootCF[2]);
    if (params.get('orient') === '1') {
      // rotate the camera offset with the character's yaw
      const m = new THREE.Matrix4(); m.set(pose.rootCF[3],pose.rootCF[4],pose.rootCF[5],0,pose.rootCF[6],pose.rootCF[7],pose.rootCF[8],0,pose.rootCF[9],pose.rootCF[10],pose.rootCF[11],0,0,0,0,1);
      const fwd = new THREE.Vector3(0,0,-1).applyMatrix4(m); fwd.y = 0; fwd.normalize();
      const yaw = Math.atan2(-fwd.x, -fwd.z);
      const rot = new THREE.Matrix4().makeRotationY(yaw);
      const te = eye.clone().sub(new THREE.Vector3(0,3.3,0)).applyMatrix4(rot).add(new THREE.Vector3(0,3.3,0));
      const tt = target.clone().sub(new THREE.Vector3(0,3.3,0)).applyMatrix4(rot).add(new THREE.Vector3(0,3.3,0));
      eye.copy(te); target.copy(tt);
    }
    target.add(off); eye.add(off);
  }
  cam.position.copy(eye);
  cam.lookAt(target);
  stage.key.target.position.copy(target);
  stage.key.position.copy(target).add(new THREE.Vector3(-6, 11, -8));
  renderer.render(stage.scene, cam);
  return true;
};
window.viewCount = views.length;
window.frameCount = poseFrames ? poseFrames.frames.length : 1;
window.ready = true;
</script>
</body>
</html>
